[pytest]
log_cli = true
log_cli_level = INFO
# Only collect test_*.py files (not *_test.py which are Bazel-only tests)
python_files = test_*.py
# PyTest should not recurse into the project directories,
# they may contain other unit tests.
testpaths =
    test/unit
    test/foss
norecursedirs =
    test/foss/*/test-proj
    # This is why the template dir is named different in `unit` and `foss`
    templates
    __pycache__
    .pytest_cache
    bazel-* .*
